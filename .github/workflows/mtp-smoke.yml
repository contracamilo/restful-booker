name: MTP Smoke Suite (Actividad 2)

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build and start restful-booker
        run: docker compose up -d --build

      - name: Wait for API health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ping; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          exit 1

      - name: Run Cucumber/JUnit smoke suite
        working-directory: master-plan/automation
        run: mvn -B test

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtp-smoke-evidence
          path: |
            master-plan/automation/target/surefire-reports/
            master-plan/automation/target/cucumber-reports/

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
